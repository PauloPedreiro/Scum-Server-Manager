; ============================================================================
;  bsbr_scum - configuracao
; ============================================================================

; ============================================================================
;  Socket de comandos
; ============================================================================
;
;  port  ->  porta TCP. Padrao 27100. Fora de 1-65535 volta ao padrao.
;
;  O socket escuta SEMPRE em 127.0.0.1, e isso nao e configuravel de proposito:
;  nao ha autenticacao nenhuma. Quem alcanca esta porta executa qualquer um dos
;  233 comandos, inclusive 'sudo DisableServer', que bloqueia a entrada de
;  todos - inclusive a sua.
;
;  Em loopback isso equivale a ja ter a maquina. Aberto na rede, equivaleria a
;  entregar o servidor a quem varresse a porta.
;
;  Para alcancar de fora, o caminho e tunel (VPN ou SSH), ou um backend rodando
;  na propria maquina e falando com o socket em loopback - com a autenticacao
;  de verdade no backend.
;
;  Trocar a porta exige reiniciar o servidor, e ajustar a funcao 'scum' do
;  PowerShell, que tem a porta escrita nela.
; ----------------------------------------------------------------------------

;  QUEM RECEBE A RESPOSTA DOS COMANDOS DA API
;  Todos os admins conectados, e so eles. A lista sai do AdminUsers.ini do
;  proprio servidor - nao ha copia dos IDs aqui de proposito, porque lista
;  duplicada desanda quando alguem e promovido e so um dos lados e atualizado.
;
;  Ler do arquivo tambem e o que mantem isso barato: sem ele, o mod pergunta
;  'IsUserAdmin' ao jogo para CADA jogador conectado, duas vezes por comando -
;  com 100 jogadores, 200 chamadas de funcao do jogo por comando.
;
;  admin_file  ->  caminho do AdminUsers.ini.
;      EM BRANCO o mod descobre sozinho, a partir de onde a propria DLL esta:
;      sobe ate a pasta 'Binaries' e monta o caminho do 'Saved'. Funciona em
;      qualquer disco e qualquer pasta de instalacao.
;
;      Preencha apenas se o seu servidor tiver layout diferente do padrao. O log
;      mostra qual caminho foi usado e quantos admins foram lidos.
; ----------------------------------------------------------------------------

[api]
port = 27100
admin_file =


[debug]

; ---------------------------------------------------------------------------
;  output_capture  ->  0 = desligado (padrao)  |  1 = ligado
; ---------------------------------------------------------------------------
;
;  O QUE FAZ
;  Registra no UE4SS.log, com a marca [bsbr_scum][out], toda linha que o
;  servidor envia ao chat dos jogadores. Isso inclui a RESPOSTA dos comandos
;  de admin - por exemplo "'X' is not allowed to be spawned" ou o resultado
;  de um ListPlayers.
;
;  POR QUE NAO VEM LIGADO
;  A resposta de um comando so existe na mensagem enviada ao cliente. Essa
;  funcao executa no CLIENTE, entao nao da para desviar so ela no servidor:
;  o unico ponto de observacao e o ProcessEvent, que intercepta TODA chamada
;  de funcao do jogo - milhares por segundo, multiplicadas por jogador.
;  Num servidor cheio isso pesa.
;
;  PRE-REQUISITO
;  Exige HookUObjectProcessEvent = 1 na secao [Hooks] do UE4SS-settings.ini.
;  Com ele em 0, esta opcao nao tem efeito algum.
;
;  IMPORTANTE: colocar esta opcao em 0 NAO remove o custo. Quem instala o
;  desvio global e o HookUObjectProcessEvent. Esta chave apenas evita o
;  trabalho dentro do nosso callback. Para custo zero de verdade, deixe o
;  HookUObjectProcessEvent = 0.
;
;  PRIVACIDADE
;  A captura pega TODO o chat, nao apenas resposta de comando. Com jogadores
;  reais, conversas privadas acabam gravadas no log. Ligue apenas durante
;  investigacao e desligue em seguida.
;
;  RECOMENDACAO
;    Producao         -> 0 aqui e HookUObjectProcessEvent = 0
;    Desenvolvimento  -> 1 aqui e HookUObjectProcessEvent = 1
;
;  EM RUNTIME
;  Da para alternar sem reiniciar, pelo socket de comandos:
;      capture on
;      capture off
;  O valor abaixo define apenas como o mod inicia.
; ---------------------------------------------------------------------------
output_capture = 0


; ============================================================================
;  Presets de spawn
; ============================================================================
;
;  Cada secao vira um preset do comando 'spawn'. As chaves numeradas sao
;  VARIANTES, nao quantidade - 'spawn friend 3' cria UM npc da variante 3.
;
;      #bsbr spawn friend           variante 1, em quem digitou
;      #bsbr @Fulano spawn friend 3 variante 3, no Fulano
;      scum as Fulano spawn friend 3
;
;  Os nomes sao tipos de NPC do proprio jogo, os mesmos que o comando
;  SpawnArmedNPC aceita. Para ver a lista, digite '#SpawnArmedNPC ' no chat
;  do jogo - com o espaco no fim - e leia as sugestoes.
;
;  Trocar, adicionar ou remover variante aqui NAO exige recompilar o mod.
; ----------------------------------------------------------------------------

;  despawn  ->  segundos de vida sem jogador por perto.
;  NPC armado some sozinho quando ninguem fica perto. Valor alto mantem o
;  guarda no lugar; deixe a linha comentada para usar o padrao do jogo.

;  As variantes sao NOMES DE ASSET, os mesmos que o comando SpawnArmedNPC do
;  jogo aceita. Para ver a lista, digite '#SpawnArmedNPC ' no chat - com o
;  espaco no fim - e leia as sugestoes.
;
;  O NPC nasce pelo comando do jogo, nao direto pela engine. Criar o ator com
;  BeginDeferredActorSpawnFromClass derrubou o servidor: um ArmedNPC precisa da
;  inicializacao que o jogo faz (posse pelo AIController, arma, inventario).
;
;  despawn  ->  segundos de vida sem jogador por perto.
;
;  subteam  ->  valor usado no _genericTeamId do NPC. Copiar o subtime real do
;  jogador cai na linha 'OtherSubteam' da matriz de atitudes, que e hostil.
;  Descoberto por observacao; mude apenas com teste.

[friend]
despawn = 3600
subteam = 0x8000000000000000

1 = BP_Guard_Lvl_1
2 = BP_Guard_Lvl_2
3 = BP_Guard_Lvl_3
4 = BP_Guard_Lvl_5
