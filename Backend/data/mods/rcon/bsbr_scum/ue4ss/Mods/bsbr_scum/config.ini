; ============================================================================
;  bsbr_scum - configuracao
; ============================================================================

; ============================================================================
;  Socket de comandos
; ============================================================================
;
;  port  ->  porta TCP. Padrao 27100. Fora de 1-65535 volta ao padrao.
;
;  O socket escuta SEMPRE em 127.0.0.1, e isso nao e configuravel de proposito:
;  nao ha autenticacao nenhuma. Quem alcanca esta porta executa qualquer um dos
;  233 comandos, inclusive 'sudo DisableServer', que bloqueia a entrada de
;  todos - inclusive a sua.
;
;  Em loopback isso equivale a ja ter a maquina. Aberto na rede, equivaleria a
;  entregar o servidor a quem varresse a porta.
;
;  Para alcancar de fora, o caminho e tunel (VPN ou SSH), ou um backend rodando
;  na propria maquina e falando com o socket em loopback - com a autenticacao
;  de verdade no backend.
;
;  Trocar a porta exige reiniciar o servidor, e ajustar a funcao 'scum' do
;  PowerShell, que tem a porta escrita nela.
; ----------------------------------------------------------------------------

;  echo  ->  0 (padrao) = a resposta volta so pelo socket, nada no chat.
;            1 = alem do socket, o comando e a resposta sao ecoados no chat de
;            todos os admins conectados, como registro compartilhado. Custa um
;            RPC de chat por linha e por admin (um 'help' sao 20 linhas), e
;            polui o chat de quem esta jogando.
;
;  QUEM RECEBE O ECO, QUANDO LIGADO
;  Todos os admins conectados, e so eles. A lista sai do AdminUsers.ini do
;  proprio servidor - nao ha copia dos IDs aqui de proposito, porque lista
;  duplicada desanda quando alguem e promovido e so um dos lados e atualizado.
;
;  Ler do arquivo tambem e o que mantem isso barato: sem ele, o mod pergunta
;  'IsUserAdmin' ao jogo para CADA jogador conectado, duas vezes por comando -
;  com 100 jogadores, 200 chamadas de funcao do jogo por comando.
;
;  admin_file  ->  caminho do AdminUsers.ini.
;      EM BRANCO o mod descobre sozinho, a partir de onde a propria DLL esta:
;      sobe ate a pasta 'Binaries' e monta o caminho do 'Saved'. Funciona em
;      qualquer disco e qualquer pasta de instalacao.
;
;      Preencha apenas se o seu servidor tiver layout diferente do padrao. O log
;      mostra qual caminho foi usado e quantos admins foram lidos.
; ----------------------------------------------------------------------------

[api]
port = 27100
echo = 0
admin_file =


; ============================================================================
;  Executor sintetico  --  EXPERIMENTAL
; ============================================================================
;
;  O PROBLEMA
;  Comando do jogo so executa se quem o envia for admin. Sem nenhum admin
;  conectado, o mod pede emprestado o canal de um jogador comum e o SCUM
;  responde 'Not authorized to execute command'. Isso derruba entrega
;  automatica de madrugada, que e quando o painel mais roda sozinho.
;
;  Tres contornos foram medidos e descartados em 2026-08-26:
;    Client_SetIsAdmin - RPC de cliente, avisa a interface e nao da poder
;    sudo              - a checagem e de identidade, nao de nivel do comando
;    AdminUsers.ini    - o jogo le na CONEXAO do jogador e guarda a resposta
;
;  O QUE ESTA OPCAO FAZ
;  Cria um ConZPlayerController proprio, com corpo, e forja no pawn dele o
;  SteamID configurado abaixo. Se o jogo comparar esse identificador com a
;  lista de admins a cada comando, o fantasma passa e a entrega funciona sem
;  ninguem online.
;
;  AINDA NAO CONFIRMADO que funcione. Se o jogo tiver decidido a autoridade na
;  conexao, o fantasma sera recusado igual - sem quebrar nada, apenas sem
;  resolver. Por isso vem desligado.
;
;  COMO LIGAR
;    1. Escolha um SteamID64 que NENHUM jogador use
;    2. Ponha esse mesmo ID no AdminUsers.ini do servidor
;    3. Escreva o ID aqui embaixo e reinicie
;
;  steam_id  ->  vazio (padrao) = desligado, o fantasma nunca e criado.
;
;  CUSTO
;  Criado na primeira vez que faz falta, nunca no boot e nunca por tick. Depois
;  disso e ponteiro guardado; o preco por comando sao duas leituras de flag. O
;  tick dos dois atores fica desligado - o fantasma nao simula nada.
;
;  EFEITOS COLATERAIS POSSIVEIS
;  Um controller e um personagem a mais vivos no servidor. Podem aparecer em
;  contagem de jogadores ou em comando de listagem. Confira antes de usar em
;  producao.
; ----------------------------------------------------------------------------

[fantasma]
steam_id =


; ============================================================================
;  Socket Source RCON
; ============================================================================
;
;  Uma SEGUNDA porta, ao lado da [api] acima. As duas convivem e nao se
;  atrapalham: a [api] fala linha de texto, sem senha, e fecha a conexao a cada
;  comando; esta fala pacotes com cabecalho, exige senha e mantem a conexao
;  aberta.
;
;  PARA QUE SERVE
;  Gerenciador externo - painel web, bot, SSM - nao tem SteamID e nao e admin
;  do servidor. A senha desta porta e o que substitui essa checagem. Ela vale
;  APENAS aqui: a [api] e o chat continuam sem senha nenhuma.
;
;  port      ->  porta TCP. Padrao 28015, que e o que a maioria dos clientes
;                ja assume. Precisa bater com a configurada no cliente.
;
;  password  ->  OBRIGATORIA. EM BRANCO A PORTA NAO SOBE. O valor que vem no
;                pacote (181917) e o padrao do SSM de teste: troque em producao
;                e use o mesmo valor em rcon.password no config.json do SSM.
;                Sem ela, qualquer processo da maquina executaria os 233
;                comandos - inclusive 'sudo DisableServer', que tranca a
;                entrada de todos.
;
;  A senha viaja EM TEXTO CLARO: o protocolo Source RCON nao tem cifra. Por
;  isso esta porta tambem escuta so em 127.0.0.1, e isso nao e configuravel.
;  Para alcancar de fora, o caminho e tunel (VPN ou SSH) ou um backend na
;  propria maquina falando com o socket em loopback.
;
;  DIFERENCA DE COMPORTAMENTO
;  Comando que chega por AQUI pode usar o executor sintetico da secao abaixo,
;  quando nao houver admin online. Comando pelo chat ou pela [api] nao - ali
;  quem executa e um administrador de verdade, sempre.
;
;  A resposta desta porta tambem NAO e ecoada no chat dos admins. Gerenciador
;  consulta em laco, e ecoar cada consulta inundaria o chat de quem joga.
;
;  max_connections  ->  conexoes simultaneas. Padrao 4. Um gerenciador usa
;                       uma; a quinta conexao e fechada logo apos aceitar.
;                       Conexao que nao manda a senha em 10 s tambem cai.
;
;  split_replies    ->  0 (padrao) = resposta inteira num pacote so, do
;                       tamanho que for. E o que o SSM exige: o cliente dele
;                       le UM pacote por comando, e um segundo pacote viraria
;                       a resposta do comando seguinte.
;                       1 = resposta acima de 4096 bytes e picotada em varios
;                       pacotes com o mesmo id, que e a convencao do Source
;                       RCON e o que mcrcon, rcon-cli e afins esperam.
;                       Escolha pelo cliente que vai conectar.
;
;  elevate          ->  1 (padrao) = comando do jogo que chega por esta porta
;                       executa SEM precisar de administrador conectado.
;                       0 = so executa se quem empresta o canal ja for admin.
;
;                       E a chave que faz a entrega automatica funcionar de
;                       madrugada: sem ela, a loja do painel so entrega
;                       quando um admin esta online.
;
;                       COMO FUNCIONA: todo comando do jogo tem um nivel
;                       exigido, e o proprio jogo tem comandos de nivel 0 -
;                       Mute, Unmute, CheckServerTime - que qualquer jogador
;                       usa. Nivel 1 ja e administrador. Enquanto o comando
;                       roda, e so durante essa chamada, o nivel dele cai
;                       para 0 e o jogo deixa de exigir identidade de admin.
;                       O nivel original volta em seguida, inclusive quando o
;                       comando falha.
;
;                       AINDA PRECISA de UM jogador qualquer conectado, que
;                       normalmente e o proprio comprador: o comando viaja
;                       pelo canal dele. Com o servidor vazio nao ha canal.
;                       Esse jogador NAO vira admin e nao percebe nada.
;
;                       Chat e porta [api] nao mudam de comportamento.
;
;  PROTECAO DE SENHA (nao configuravel)
;  Senha errada custa 1 s antes da recusa. Cinco erros do mesmo endereco em
;  5 min bloqueiam o endereco por 5 min. Em loopback o endereco e sempre o
;  mesmo, entao isso e protecao contra processo local em laco - e inclui
;  voce, se errar a senha cinco vezes.
;
;  ANTES DO SERVIDOR SUBIR
;  Comando que chega antes de o mundo existir recebe na hora
;  'server still starting' em vez de esperar o timeout. Clientes do mod
;  antigo ja reconhecem esse texto.
; ----------------------------------------------------------------------------

[source]
port = 28015
password = 181917
max_connections = 4
split_replies = 0
elevate = 1


[debug]

; ---------------------------------------------------------------------------
;  output_capture  ->  0 = desligado (padrao)  |  1 = ligado
; ---------------------------------------------------------------------------
;
;  O QUE FAZ
;  Registra no UE4SS.log, com a marca [bsbr_scum][out], toda linha que o
;  servidor envia ao chat dos jogadores. Isso inclui a RESPOSTA dos comandos
;  de admin - por exemplo "'X' is not allowed to be spawned" ou o resultado
;  de um ListPlayers.
;
;  POR QUE NAO VEM LIGADO
;  A resposta de um comando so existe na mensagem enviada ao cliente. Essa
;  funcao executa no CLIENTE, entao nao da para desviar so ela no servidor:
;  o unico ponto de observacao e o ProcessEvent, que intercepta TODA chamada
;  de funcao do jogo - milhares por segundo, multiplicadas por jogador.
;  Num servidor cheio isso pesa.
;
;  PRE-REQUISITO
;  Exige HookUObjectProcessEvent = 1 na secao [Hooks] do UE4SS-settings.ini.
;  Com ele em 0, esta opcao nao tem efeito algum.
;
;  IMPORTANTE: colocar esta opcao em 0 NAO remove o custo. Quem instala o
;  desvio global e o HookUObjectProcessEvent. Esta chave apenas evita o
;  trabalho dentro do nosso callback. Para custo zero de verdade, deixe o
;  HookUObjectProcessEvent = 0.
;
;  PRIVACIDADE
;  A captura pega TODO o chat, nao apenas resposta de comando. Com jogadores
;  reais, conversas privadas acabam gravadas no log. Ligue apenas durante
;  investigacao e desligue em seguida.
;
;  RECOMENDACAO
;    Producao         -> 0 aqui e HookUObjectProcessEvent = 0
;    Desenvolvimento  -> 1 aqui e HookUObjectProcessEvent = 1
;
;  EM RUNTIME
;  Da para alternar sem reiniciar, pelo socket de comandos:
;      capture on
;      capture off
;  O valor abaixo define apenas como o mod inicia.
; ---------------------------------------------------------------------------
output_capture = 0

; ---------------------------------------------------------------------------
;  perf_log  ->  0 = desligado (padrao)  |  1 = ligado
; ---------------------------------------------------------------------------
;
;  Grava no bsbr_scum.log, para cada comando, quanto tempo ele ocupou a thread
;  do jogo:
;      [perf] 0.412 ms  ListPlayers
;
;  E o instrumento para saber o que um gerenciador que consulta a cada 5 s
;  custa de verdade antes de otimizar. Custo quando ligado: dois timestamps
;  por comando. Quando desligado: nada. Nunca roda por tick.
; ---------------------------------------------------------------------------
perf_log = 0


; ============================================================================
;  Presets de spawn
; ============================================================================
;
;  Cada secao vira um preset do comando 'spawn'. As chaves numeradas sao
;  VARIANTES, nao quantidade - 'spawn friend 3' cria UM npc da variante 3.
;
;      #bsbr spawn friend           variante 1, em quem digitou
;      #bsbr @Fulano spawn friend 3 variante 3, no Fulano
;      scum as Fulano spawn friend 3
;
;  Os nomes sao tipos de NPC do proprio jogo, os mesmos que o comando
;  SpawnArmedNPC aceita. Para ver a lista, digite '#SpawnArmedNPC ' no chat
;  do jogo - com o espaco no fim - e leia as sugestoes.
;
;  Trocar, adicionar ou remover variante aqui NAO exige recompilar o mod.
; ----------------------------------------------------------------------------

;  despawn  ->  segundos de vida sem jogador por perto.
;  NPC armado some sozinho quando ninguem fica perto. Valor alto mantem o
;  guarda no lugar; deixe a linha comentada para usar o padrao do jogo.

;  As variantes sao NOMES DE ASSET, os mesmos que o comando SpawnArmedNPC do
;  jogo aceita. Para ver a lista, digite '#SpawnArmedNPC ' no chat - com o
;  espaco no fim - e leia as sugestoes.
;
;  O NPC nasce pelo comando do jogo, nao direto pela engine. Criar o ator com
;  BeginDeferredActorSpawnFromClass derrubou o servidor: um ArmedNPC precisa da
;  inicializacao que o jogo faz (posse pelo AIController, arma, inventario).
;
;  despawn  ->  segundos de vida sem jogador por perto.
;
;  subteam  ->  valor usado no _genericTeamId do NPC. Copiar o subtime real do
;  jogador cai na linha 'OtherSubteam' da matriz de atitudes, que e hostil.
;  Descoberto por observacao; mude apenas com teste.

[friend]
despawn = 3600
subteam = 0x8000000000000000

1 = BP_Guard_Lvl_1
2 = BP_Guard_Lvl_2
3 = BP_Guard_Lvl_3
4 = BP_Guard_Lvl_5
