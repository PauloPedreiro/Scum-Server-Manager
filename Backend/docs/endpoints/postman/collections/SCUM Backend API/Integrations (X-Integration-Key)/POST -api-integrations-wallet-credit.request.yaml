$kind: http-request
name: POST /api/integrations/wallet/credit
description: Adiciona créditos na carteira via integração (X-Integration-Key).
url: "{{baseUrl}}/api/integrations/wallet/credit"
method: POST
headers:
  Content-Type: application/json
  X-Integration-Key: "{{integrationKey}}"
body:
  type: json
  content: |-
    {
      "external_id": "postman:credit:{{$randomUUID}}",
      "steam_id": "{{steamId}}",
      "amount": 100,
      "meta": {
        "source": "postman"
      }
    }
order: 1000
