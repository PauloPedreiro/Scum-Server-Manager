$kind: http-request
name: POST /api/integrations/vip/deactivate
description: Desativa VIP via integração (X-Integration-Key).
url: "{{baseUrl}}/api/integrations/vip/deactivate"
method: POST
headers:
  Content-Type: application/json
  X-Integration-Key: "{{integrationKey}}"
body:
  type: json
  content: |-
    {
      "external_id": "{{integrationExternalId}}",
      "steam_id": "{{steamId}}",
      "meta": {
        "source": "postman"
      }
    }
order: 5000
